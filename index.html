<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Greenlight Market · Buy and sell games, prototypes and game ideas</title>
<meta name="description" content="A marketplace where indie developers sell finished games, playable prototypes and game ideas to other developers, studios and investors. List for free, message buyers, make offers.">
<meta property="og:title" content="Greenlight Market">
<meta property="og:description" content="Buy and sell games, prototypes and game ideas. List for free, message buyers, close the deal.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#3a57f0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%2311845b'/%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%2311845b' stroke-opacity='.3' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="#/"><span class="lamp" aria-hidden="true"></span>Greenlight</a>
    <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sr">Search</span><input id="q" type="search" placeholder="Search Greenlight" autocomplete="off"></label>
    <nav aria-label="Sections">
      <a class="navbtn" href="#/" data-view="browse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="lbl">Browse</span></a>
      <a class="navbtn" href="#/inbox" data-view="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.8 7L4 20.5l1.5-4.7A8 8 0 1 1 21 12z"/></svg><span class="lbl">Inbox</span><span class="dot" id="unread" hidden></span></a>
      <a class="navbtn" href="#/selling" data-view="selling"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg><span class="lbl">Selling</span></a>
      <a class="navbtn" href="#/saved" data-view="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7.5-4.6-9.5-9.3C1.2 8.5 3.3 5 6.8 5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.5 0 5.6 3.5 4.3 6.7C19.5 16.4 12 21 12 21z"/></svg><span class="lbl">Saved</span></a>
    </nav>
    <a class="btn primary create" href="#/sell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">Create listing</span></a>
    <div id="account"></div>
  </div>
  <div class="wrap demo"><b>Early access.</b> Listings, photos, messages and offers are live. Checkout runs in demo mode while payments are set up, so no money moves yet.</div>
</header>
<main id="app"></main>
<footer class="wrap site">
  <span>© <span id="yr"></span> Greenlight Labs</span>
  <span><a href="#/terms">Terms</a> · <a href="#/privacy">Privacy</a> · <a href="#/how">How it works</a></span>
</footer>
<input type="file" id="filePick" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
